version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:30"
      timezone: "Australia/Melbourne"
    commit-message:
      prefix: "pip "
    target-branch: "develop"  

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:30"
      timezone: "Australia/Melbourne"
    target-branch: "develop"  
